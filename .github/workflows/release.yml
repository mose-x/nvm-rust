name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            asset_os: linux
            asset_arch: x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            asset_os: linux
            asset_arch: arm64
          # Linux musl (Alpine / distroless — fully static)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            asset_os: linux-musl
            asset_arch: x64
          # macOS Intel + Apple Silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            asset_os: macos
            asset_arch: x64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            asset_os: macos
            asset_arch: arm64
          # Windows x64 + ARM64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            asset_os: windows
            asset_arch: x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
            asset_os: windows
            asset_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compile tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
          echo "  Static liblzma via lzma-sys static feature"

      - name: Install musl toolchain (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          mkdir -p .cargo
          cat >> .cargo/config.toml <<EOF
          [target.x86_64-unknown-linux-musl]
          linker = "musl-gcc"
          rustflags = ["-C", "target-feature=+crt-static"]
          EOF
          echo "  Static musl build (fully static binary for Alpine/distroless)"

      - name: Build (static link)
        if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}
        env:
          LZMA_API_STATIC: "1"
          PKG_CONFIG_ALL_STATIC: "1"
          PKG_CONFIG_ALLOW_CROSS: "1"

      - name: Build (default)
        if: matrix.target != 'aarch64-unknown-linux-gnu' && matrix.target != 'x86_64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Compute version (from tag)
        shell: bash
        run: |
          # Tag form: refs/tags/v2.0.0 → version 2.0.0
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Fallback for workflow_dispatch (no tag): use Cargo.toml
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION=$(grep '^version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Resolved version: $VERSION"

      # Stage every friendly-pack file next to the binary before archiving.
      # Keeps the binary at the archive root so existing `nvm upgrade`
      # extract logic (looks for `nvm` / `nvm.exe` at the root) keeps working
      # for users on older versions — no breaking change in tarball layout.
      # Docs, install scripts, and shell integration files are added beside
      # the binary so a beginner who just runs `tar xzf` sees a usable
      # bundle without needing to read GitHub release notes.
      #
      # We use `$GITHUB_WORKSPACE/.stage-$$` (not `mktemp -d`) so the
      # stage dir lives inside the workspace. The Package step then
      # `cd`'s into STAGE and writes the archive to `..` — which is the
      # workspace itself on every OS, matching the upload path and the
      # `7z l` listing afterwards. With `/tmp` (mktemp's default) on
      # Windows runners, `..` lands in `/tmp` instead of the workspace
      # and the subsequent `7z l "$ASSET_NAME"` cannot find the file.
      - name: Stage friendly-pack files
        if: matrix.archive == 'tar.gz' || matrix.archive == 'zip'
        shell: bash
        run: |
          STAGE="$GITHUB_WORKSPACE/.stage-$$"
          mkdir -p "$STAGE"
          # Binary is platform-specific and was built above; keep its name.
          if [ -f "target/${{ matrix.target }}/release/nvm" ]; then
            cp "target/${{ matrix.target }}/release/nvm" "$STAGE/nvm"
          elif [ -f "target/${{ matrix.target }}/release/nvm.exe" ]; then
            cp "target/${{ matrix.target }}/release/nvm.exe" "$STAGE/nvm.exe"
          else
            echo "::error::Binary not found in target/${{ matrix.target }}/release/"
            exit 1
          fi
          # Documentation: bilingual README + LICENSE (MIT).
          cp README.md "$STAGE/README.md"
          cp README.ZH_CN.md "$STAGE/README.ZH_CN.md"
          cp LICENSE "$STAGE/LICENSE"
          # Installers: ship the repo's install scripts so a beginner can
          # run `./install.sh` after extracting (or `./install.ps1` on
          # Windows). The scripts read paths relative to their own
          # location, so this works without a separate download.
          cp install.sh "$STAGE/install.sh"
          cp install.ps1 "$STAGE/install.ps1"
          # Shell integration: bash/zsh (nvm.sh), fish (nvm.fish),
          # PowerShell (nvm.psm1). These are PATH-setup / environment
          # helpers, NOT tab-completion scripts. The actual completion
          # files are generated at runtime by `nvm completion <shell>`
          # (see src/completions.rs), and installing them is out of scope
          # for the static tarball.
          mkdir -p "$STAGE/shell"
          cp shell/nvm.sh "$STAGE/shell/nvm.sh"
          cp shell/nvm.fish "$STAGE/shell/nvm.fish"
          cp shell/nvm.psm1 "$STAGE/shell/nvm.psm1"
          echo "STAGE=$STAGE" >> $GITHUB_ENV
          echo "Staged files:"
          ( cd "$STAGE" && find . -maxdepth 3 -type f | sort )

      - name: Package (Unix tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          ASSET_NAME="nvm-${{ env.VERSION }}-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.tar.gz"
          tar -czf "$ASSET_NAME" -C "$STAGE" .
          echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV
          echo "Packaged: $ASSET_NAME"
          echo "Contents:"
          tar -tzf "$ASSET_NAME" | sort

      - name: Package (Windows zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          ASSET_NAME="nvm-${{ env.VERSION }}-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.zip"
          ( cd "$STAGE" && 7z a "../$ASSET_NAME" . > /dev/null )
          echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV
          echo "Packaged: $ASSET_NAME"
          echo "Contents:"
          7z l "$ASSET_NAME" | tail -n +20 | head -n -2 | awk '{print $NF}' | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_NAME }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          # Flatten all artifacts into the current directory instead of
          # creating one subdirectory per artifact. Without this, an
          # artifact named `nvm-2.0.0-linux-arm64.tar.gz` would be
          # downloaded as `./nvm-2.0.0-linux-arm64.tar.gz/nvm-2.0.0-linux-arm64.tar.gz`,
          # and the subsequent `sha256sum nvm-*.*` glob would match the
          # outer directory rather than the file, breaking checksum
          # generation with "cannot overwrite directory with non-directory".
          merge-multiple: true

      - name: Generate checksums
        run: |
          sha256sum nvm-*.* > sha256sums.txt
          echo "---checksums---"
          cat sha256sums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nvm-*.tar.gz
            nvm-*.zip
            sha256sums.txt
          generate_release_notes: true
