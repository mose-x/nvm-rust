# Statically link the MSVC C runtime so nvm.exe has zero external DLL
# dependencies. Without this, users on clean Windows installs (no Visual
# C++ Redistributable) hit "VCRUNTIME140.dll not found" on first run.
# cargo only reads the matching target section, so this is ignored on
# Linux/macOS builds and does not conflict with the per-target configs
# that release.yml appends for musl/ARM cross-compilation.
[target.'cfg(windows)']
rustflags = ["-C", "target-feature=+crt-static"]

# `cargo devbuild` — build debug binary and auto-copy to ~/.nvm.rust/bin/
# so the new binary is immediately usable without manual copy.
# On Windows without Git Bash, run: scripts\devbuild.bat
[alias]
devbuild = "!sh -c 'cargo build && mkdir -p \"$HOME/.nvm.rust/bin\" && cp target/debug/nvm \"$HOME/.nvm.rust/bin/nvm\" && echo \"✓ Copied to ~/.nvm.rust/bin/nvm\"'"
