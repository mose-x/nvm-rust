name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            asset_os: linux
            asset_arch: x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            asset_os: linux
            asset_arch: arm64
          # Linux musl (Alpine / distroless — fully static)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            asset_os: linux-musl
            asset_arch: x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            asset_os: linux-musl
            asset_arch: arm64
          # macOS Intel + Apple Silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            asset_os: macos
            asset_arch: x64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            asset_os: macos
            asset_arch: arm64
          # Windows x64 + ARM64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            asset_os: windows
            asset_arch: x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
            asset_os: windows
            asset_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compile tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
          echo "  Static liblzma via lzma-sys static feature"

      - name: Install musl toolchain (Linux musl x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          mkdir -p .cargo
          cat >> .cargo/config.toml <<EOF
          [target.x86_64-unknown-linux-musl]
          linker = "musl-gcc"
          rustflags = ["-C", "target-feature=+crt-static"]
          EOF
          echo "  Static musl build (fully static binary for Alpine/distroless)"

      - name: Install musl toolchain (Linux musl arm64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          curl -sLO --retry 3 --retry-delay 5 --max-time 180 https://musl.cc/aarch64-linux-musl-cross.tgz
          tar xzf aarch64-linux-musl-cross.tgz -C /tmp
          echo "/tmp/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH
          mkdir -p .cargo
          cat >> .cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-musl]
          linker = "/tmp/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc"
          rustflags = ["-C", "target-feature=+crt-static"]
          EOF
          echo "  Static musl build (fully static binary for Alpine/distroless)"

      - name: Build (static link)
        if: matrix.target == 'aarch64-unknown-linux-gnu' || contains(matrix.target, 'musl')
        run: cargo build --release --target ${{ matrix.target }}
        env:
          LZMA_API_STATIC: "1"
          PKG_CONFIG_ALL_STATIC: "1"
          PKG_CONFIG_ALLOW_CROSS: "1"

      - name: Build (default)
        if: matrix.target != 'aarch64-unknown-linux-gnu' && !contains(matrix.target, 'musl')
        run: cargo build --release --target ${{ matrix.target }}

      - name: Compute version (from tag)
        shell: bash
        run: |
          # Tag form: refs/tags/v2.0.0 → version 2.0.0
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Fallback for workflow_dispatch (no tag): use Cargo.toml
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION=$(grep '^version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Resolved version: $VERSION"

      - name: Package release archive
        if: matrix.archive == 'tar.gz' || matrix.archive == 'zip'
        shell: bash
        run: |
          # Detect binary path (nvm on Unix, nvm.exe on Windows)
          BIN=""
          if [ -f "target/${{ matrix.target }}/release/nvm" ]; then
            BIN="target/${{ matrix.target }}/release/nvm"
          elif [ -f "target/${{ matrix.target }}/release/nvm.exe" ]; then
            BIN="target/${{ matrix.target }}/release/nvm.exe"
          else
            echo "::error::Binary not found in target/${{ matrix.target }}/release/"
            exit 1
          fi
          # Call the shared packaging script (same one local users use)
          ASSET_NAME=$(bash scripts/package.sh "$BIN" "${{ env.VERSION }}" "${{ matrix.asset_os }}" "${{ matrix.asset_arch }}")
          echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_NAME }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          # Flatten all artifacts into the current directory instead of
          # creating one subdirectory per artifact. Without this, an
          # artifact named `nvm-2.0.0-linux-arm64.tar.gz` would be
          # downloaded as `./nvm-2.0.0-linux-arm64.tar.gz/nvm-2.0.0-linux-arm64.tar.gz`,
          # and the subsequent `sha256sum nvm-*.*` glob would match the
          # outer directory rather than the file, breaking checksum
          # generation with "cannot overwrite directory with non-directory".
          merge-multiple: true

      - name: Generate checksums
        run: |
          sha256sum nvm-*.* > sha256sums.txt
          echo "---checksums---"
          cat sha256sums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nvm-*.tar.gz
            nvm-*.zip
            sha256sums.txt
          generate_release_notes: true
