name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit is pushed,
# so we don't waste CI minutes on superseded PR commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Lint runs once on Linux: fmt + clippy are platform-independent and
  # running them 3x would just burn CI minutes.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read the floor from Cargo.toml instead of hardcoding it here, so the
      # manifest and the workflow cannot drift apart.
      #
      # The value is validated here because Cargo.toml is attacker-controlled
      # on a `pull_request` from a fork, and later steps consume this output.
      # Without the shape check, `rust-version = "1.93$(curl …)"` reaches the
      # shell verbatim — and inside double quotes command substitution still
      # runs, so quoting alone at the use sites is not a defence.
      - name: Read declared MSRV from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          v=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$v" ]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          # Allow a plain version (`1.93`, `1.93.0`, `1.93-beta`) or a rustup
          # channel keyword — both are legal `rust-version` values. Everything
          # else, in particular `$`, backticks, quotes and spaces, is rejected.
          if ! printf '%s' "$v" | grep -Eq '^([0-9]+(\.[0-9]+)*([.-][0-9A-Za-z.-]+)?|stable|beta|nightly)$'; then
            echo "::error::rust-version is not a plain version string: $v"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install Rust (stable, with rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Plain rustup, NOT dtolnay/rust-toolchain: that action also makes the
      # installed toolchain the rustup *default*, which breaks `cargo fmt` and
      # `cargo clippy` below because the MSRV toolchain ships no rustfmt.
      # `--profile minimal` skips docs/clippy/rustfmt; `cargo +<msrv>` selects
      # this toolchain explicitly at the check step.
      #
      # `$MSRV` is passed via `env:` rather than interpolated into the script,
      # so no manifest content can reach the shell as code.
      - name: Install Rust (MSRV ${{ steps.msrv.outputs.version }})
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$MSRV" --profile minimal --no-self-update

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings

      # Without this step `rust-version` is a claim nobody checks: the first
      # dependency to raise its own floor would silently invalidate it.
      # Lives in this job for the same reason as cargo-deny below — branch
      # protection requires `fmt + clippy` by name, so a separate `msrv` job
      # would run but never block a merge.
      - name: MSRV build check (${{ steps.msrv.outputs.version }})
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+$MSRV" check --all-targets --locked

      # cargo-deny replaces `rustsec/audit-check`, which never read
      # `audit.toml` (its CI output reported `"ignore":[]`), leaving that
      # file's ignores as dead config. cargo-deny honours `deny.toml` and
      # covers advisories, licenses, bans and sources in one pass.
      #
      # Installed from a pinned tarball instead of
      # EmbarkStudios/cargo-deny-action: that action's Dockerfile pipes
      # `curl --silent -L` — no `-f` — into `tar -xz`, so an HTTP error page
      # still exits 0 and the job later dies with `gzip: stdin: not in gzip
      # format`. That turned this required check red on #139 for a reason
      # unrelated to the change. Here `-f` makes HTTP errors fatal at the
      # download, `--retry` absorbs transient failures, and the pinned sha256
      # means a truncated or substituted artifact fails with a clear message
      # instead of as a mystery downstream.
      #
      # The checksum line is built locally rather than fed from upstream's
      # `.sha256` asset on purpose: that file is a bare 64-byte hash with no
      # filename and no trailing newline, which `sha256sum -c` rejects with
      # "no properly formatted SHA256 checksum lines found".
      #
      # Kept inside this job on purpose: branch protection requires the
      # `fmt + clippy` check by name, so a separate job would not be
      # enforced and renaming this one would break the required check.
      - name: Dependency policy + advisories (cargo deny)
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-musl
          tarball="cargo-deny-${CARGO_DENY_VERSION}-${target}.tar.gz"
          # Download outside the checkout so the tarball and its extracted
          # directory never land in the working tree.
          work="${RUNNER_TEMP}/cargo-deny"
          mkdir -p "$work"
          curl -fsSL --retry 3 --retry-delay 2 -o "${work}/${tarball}" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${tarball}"
          echo "${CARGO_DENY_SHA256}  ${work}/${tarball}" | sha256sum -c -
          tar -xzf "${work}/${tarball}" -C "$work"
          deny="${work}/cargo-deny-${CARGO_DENY_VERSION}-${target}/cargo-deny"
          # Run the binary directly; invoking the downloaded file is identical
          # to `cargo deny` and needs no write access to a PATH directory.
          # CWD stays the checkout so cargo-deny resolves this workspace.
          "$deny" --version
          # `--all-features` is a top-level cargo-deny flag and must precede
          # `check`; after it, cargo-deny rejects it as an unexpected argument.
          "$deny" --all-features check advisories licenses bans sources

  # Tests run on all three OSes so Windows-specific code paths
  # (extract.rs 7z handling, #[cfg(unix)] symlinks, where.exe lookup)
  # and macOS get real regression coverage instead of only building.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --all

      # Smoke test the RELEASE artifact. `cargo test` only ever builds the
      # debug profile, so `[profile.release]` (lto = true, codegen-units = 1,
      # strip = true) was never validated on any platform — an LTO or
      # strip-induced breakage would ship. This runs the binary that actually
      # gets distributed.
      #
      # Only read-only subcommands: `nvm refresh` is deliberately excluded
      # because it rewrites the runner's PowerShell profile, and profile
      # pollution is exactly what #126 fixed.
      - name: Smoke test release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked

          bin=./target/release/nvm
          [ -x "$bin" ] || bin=./target/release/nvm.exe
          if [ ! -x "$bin" ]; then
            echo "::error::release binary was not produced"
            exit 1
          fi

          expected=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ -z "$expected" ]; then
            echo "::error::could not read version from Cargo.toml"
            exit 1
          fi

          # Throwaway NVM_DIR so the smoke run can neither read nor write a
          # real install; ensure_nvm_dir() creates it on first use.
          export NVM_DIR="${RUNNER_TEMP:-/tmp}/nvm-smoke"

          out=$("$bin" --version)
          echo "nvm --version -> $out"
          if [ "$out" != "nvm $expected" ]; then
            echo "::error::expected 'nvm $expected', got '$out'"
            exit 1
          fi

          # Capture rather than `--help | grep -q`: grep -q exits the moment it
          # matches, closing the pipe while the binary is still writing, and
          # nvm then panics with "failed printing to stdout: Broken pipe".
          # That crash is a real bug (tracked separately) but it is not what
          # this step is asserting, so don't reintroduce the pipe here.
          help=$("$bin" --help)
          case "$help" in
            *"Usage: nvm"*) ;;
            *) echo "::error::--help printed no usage line"; exit 1 ;;
          esac

          for cmd in list current version; do
            if ! "$bin" "$cmd" > /dev/null; then
              echo "::error::'nvm $cmd' failed against a clean install"
              exit 1
            fi
          done

          echo "smoke ok: release binary runs and reports nvm $expected"

  # commit-lint: enforce commit message + identity rules on every PR commit.
  # Delegates to the code-hooks repo's reusable workflow so rule fixes
  # (e.g. the new-branch scan fix in pre-push) propagate to every consumer
  # without each repo touching its CI. Rules are read at runtime from the
  # code-hooks checkout, making that repo the single source of truth.
  #
  # code-hooks is public, so the called workflow clones it over
  # unauthenticated HTTPS -- no secrets, no deploy key needed here.
  # Branch protection on `main` requires this job's status check; that's
  # the layer that actually enforces, since `git commit --no-verify`
  # bypasses local hooks.
  commit-lint:
    name: commit-lint
    uses: mose-x/code-hooks/.github/workflows/commit-lint.yml@main
